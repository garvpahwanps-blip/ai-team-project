[theme]
base = "dark"
primaryColor = "#8B5CF6"
backgroundColor = "#0B1020"
secondaryBackgroundColor = "#161E35"
textColor = "#F5F7FF"
linkColor = "#B9A7FF"
borderColor = "#2A365C"
codeBackgroundColor = "#11182C"
dataframeHeaderBackgroundColor = "#202B4B"
dataframeHeaderTextColor = "#F5F7FF"
dataframeBorderColor = "#2A365C"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
baseFontSize = 15
baseRadius = "0.9rem"
buttonRadius = "0.7rem"
showWidgetBorder = true
showSidebarBorder = true
metricValueFontSize = "2rem"
metricValueFontWeight = 700
headingFontSizes = ["34px", "25px", "20px", "16px", "14px", "12px"]
headingFontWeights = [700, 650, 650, 600, 600, 600]
paddingTop = "1rem"
paddingBottom = "2rem"

[theme.sidebar]
backgroundColor = "#080D1A"
secondaryBackgroundColor = "#121A30"
codeBackgroundColor = "#121A30"
textColor = "#F5F7FF"
borderColor = "#273354"
primaryColor = "#8B5CF6"
linkColor = "#C4B5FD"
showWidgetBorder = true
paddingTop = "1rem"
paddingBottom = "1.5rem"
